name: Apply verified Mi encargo update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verified-mi-encargo-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and apply the prepared update
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '365c3efdc0e5d8e413674729eb228d6542f94098164c87cda7c2c320186079b5' 'mi-encargo-update.patch' | sha256sum --check -
          git diff --exit-code 3933dd476dddfa125595cb74f3ba22023704a350 -- . ':!mi-encargo-update.patch' ':!.github/workflows/apply-prepared-update.yml'
          git apply --check mi-encargo-update.patch
          git apply --index mi-encargo-update.patch
          git rm -- mi-encargo-update.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete clients, quotes, invoices and bidirectional Excel sync'
          git push origin HEAD:main
